<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tes Login</title>
    <style>
        body {
            background: orange;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 300px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #FF8C00;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .pesan {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }
        .sukses {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .gagal {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>🔑 Login Tes</h2>
    <p style="color: #666; font-size: 14px;">Username: <b>AppTokoOnLine2R</b></p>
    <p style="color: #666; font-size: 14px;">Password: <b>MyHand0286</b></p>
    
    <div id="pesan" class="pesan"></div>
    
    <input type="text" id="user" placeholder="Username">
    <input type="password" id="pass" placeholder="Password">
    <button onclick="cek()">Login</button>
</div>

<script>
function cek() {
    var u = document.getElementById('user').value;
    var p = document.getElementById('pass').value;
    var pesan = document.getElementById('pesan');
    
    if (u === '' || p === '') {
        pesan.className = 'pesan gagal';
        pesan.innerHTML = 'Isi username dan password!';
        return;
    }
    
    if (u === 'AppTokoOnLine2R' && p === 'MyHand0286') {
        pesan.className = 'pesan sukses';
        pesan.innerHTML = '✅ LOGIN BERHASIL!';
    } else {
        pesan.className = 'pesan gagal';
        pesan.innerHTML = '❌ Username atau Password salah!';
    }
}
</script>

</body>
</html>
